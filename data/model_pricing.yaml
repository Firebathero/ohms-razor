survey:
  question: Which hosted models could plausibly win the volume tier (cheapest path that clears a capability
    bar) or the frontier tier (top of the index, called rarely)?
  inclusion_criteria:
  - publicly available API with published per-token pricing
  - scored on the capability index used in data/benchmarks.yaml, or scoreable
  - no minimum-commit or enterprise-only pricing that a solo operator cannot get
  out_of_scope:
  - models without public pricing (cannot price the workload against them)
  - subscription seats rather than metered tokens (different unit; not comparable)
  where_to_look:
  - the capability index leaderboard, every entry above the current volume-tier score
  - vendor pricing pages for launches since the last survey
  - open-weights models newly available from a hosted provider, priced per token
  last_surveyed: &id001 2026-08-31
  survey_interval_days: 30
  confidence: CURRENT
  note: Surveyed 2026-08-31 by fetching vendor pricing pages directly across Anthropic, OpenAI, Google,
    xAI, DeepSeek, Zhipu, Moonshot, Alibaba, Mistral, Meta, and six open-weights hosts. Grew the set from
    4 to 97. Tiered context pricing is recorded at the base tier with the higher tier in the notes; the
    models here are the ones a solo operator can actually buy.
  considered_and_excluded:
  - candidate: claude-mythos-5
    reason: access-gated to approved organizations, so not purchasable by a solo operator at any price;
      it would otherwise contaminate a cheapest-model answer
  - candidate: CoreWeave inference
    reason: sells GPU-instance-hours, not per-token; no self-serve token price exists
  - candidate: Cerebras gpt-oss-120b
    reason: two research passes reported $0.35/$0.75 but three direct fetches of the vendor's own pricing
      pages found no public per-token rate at all. Recorded as unresolved rather than picking a side
  - candidate: Groq Llama tiers
    reason: moved off self-serve to enterprise contact-sales, so no public per-token price
  - candidate: Retired Anthropic and OpenAI snapshots
    reason: no longer on the direct API, or retiring inside the hold period

survey:
  question: Which models' capability scores do we need in order to place every priced candidate, and is
    this index still the right axis to rank capability on?
  inclusion_criteria:
  - every model in data/model_pricing.yaml needs a score, or it cannot be placed
  - every model scoring at or above the current volume-tier pick needs a cost per task
  where_to_look:
  - the index's own leaderboard, pinned to a version, at each refresh
  - the index's methodology notes for scoring changes that would break comparability with previously recorded
    scores
  alternatives_to_reconsider:
  - whether a task-specific eval would rank the volume tier differently for agent loops, which is the
    actual workload this repo models
  last_surveyed: &id001 2026-08-31
  survey_interval_days: 60
  confidence: CURRENT
  note: 'Surveyed 2026-08-31 against the leaderboard directly. 178 models are ranked; the 50 that could
    plausibly matter here are recorded. Index v4.1.1 (patch 2026-08-06) changed the grader models, so
    scores are NOT comparable across index versions: a prior version scored Grok 4 at 73, which is meaningless
    on this scale. The second question, whether this index is the right capability axis for agent loops,
    remains unanswered.'
  considered_and_excluded:
  - candidate: Provider-specific entries for open-weights models
    reason: the index scores the underlying model, not the host; hosts differ on price only
  - candidate: Legacy dated snapshots below Sonnet 4.6 and most o-series tiers
    reason: not on the leaderboard, and superseded by cheaper current tiers

survey:
  question: Which always-on machines could plausibly sustain the required token rate locally at a cost
    per token competitive with hosted inference?
  inclusion_criteria:
  - enough memory to hold a model that clears the capability bar, with usable context
  - a published or measured memory bandwidth figure
  - idle power low enough to leave running 24/7
  - buyable as a complete machine by one person
  out_of_scope:
  - multi-GPU workstations and rack servers with discrete accelerators (different economics; if this becomes
    interesting it needs its own model, not a row here)
  - clusters (the reference workload is one always-on box)
  where_to_look:
  - Apple silicon lineup at each refresh (memory ceilings move, and they have moved down)
  - AMD Strix Halo class mini-PCs and successors from GMKtec, Beelink, Minisforum
  - NVIDIA DGX Spark class desk machines and any unified-memory ARM equivalent
  - llama.cpp and vLLM benchmark threads for measured tok/s on new hardware
  last_surveyed: &id001 2026-08-31
  survey_interval_days: 90
  confidence: CURRENT
  note: 'Surveyed 2026-08-31 by live web search across Apple silicon (desktop and laptop), AMD Strix Halo
    mini-PCs, NVIDIA GB10 desk machines, consumer GPUs, and single-unit workstation/datacenter GPUs. Grew
    the set from 4 to 37. Most entries carry specs and a price; measured throughput exists for a minority
    and is never estimated where absent. Two findings worth carrying: Apple replaced its entire desktop
    lineup on 2026-08-25 so no M5/M6 machine has measured throughput yet, and several content-farm sites
    publish fabricated tok/s figures for unreleased Apple silicon which were excluded.'
  considered_and_excluded:
  - candidate: Ampere-based ARM AI workstations
    reason: no buyable single-unit desk SKU with citable price, bandwidth, and benchmark data found
  - candidate: Qualcomm Snapdragon X2 Elite Extreme PCs
    reason: 'same: no dedicated desk appliance with the figures needed to place it'
  - candidate: RTX 4090 48GB modded cards
    reason: gray-market, not an NVIDIA SKU; bandwidth unverified and the one throughput figure found was
      unsourced
  - candidate: Multi-GPU and rack workstations
    reason: 'out of scope per the survey block: different economics, would need its own model'

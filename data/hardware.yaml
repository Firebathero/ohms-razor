# Local inference candidates: unified-memory machines a person would actually put in a
# closet. Bandwidth is the number that matters; token generation is memory-bandwidth-bound.
# Measured throughput always takes precedence over the Model 2 upper-bound estimate.
# Freshness window: 30 days on prices; measured figures keep their tags.

# WHAT THIS LIST IS SUPPOSED TO COVER.
survey:
  question: >-
    Which always-on machines could plausibly sustain the required token rate locally at a
    cost per token competitive with hosted inference?
  inclusion_criteria:
    - enough memory to hold a model that clears the capability bar, with usable context
    - a published or measured memory bandwidth figure
    - idle power low enough to leave running 24/7
    - buyable as a complete machine by one person
  out_of_scope:
    - multi-GPU workstations and rack servers with discrete accelerators (different
      economics; if this becomes interesting it needs its own model, not a row here)
    - clusters (the reference workload is one always-on box)
  where_to_look:
    - Apple silicon lineup at each refresh (memory ceilings move, and they have moved down)
    - AMD Strix Halo class mini-PCs and successors from GMKtec, Beelink, Minisforum
    - NVIDIA DGX Spark class desk machines and any unified-memory ARM equivalent
    - llama.cpp and vLLM benchmark threads for measured tok/s on new hardware
  last_surveyed: null
  survey_interval_days: 90
  confidence: TODO
  note: >-
    NEVER SURVEYED. Four machines inherited from the handoff: three Apple, one Strix Halo.
    That is a narrow slice of what exists. The finding that only one configuration clears
    the throughput bar is a statement about these four, and a new high-bandwidth machine is
    exactly the kind of entrant that would change it.
  considered_and_excluded: []   # nothing recorded; see note

machines:
  - id: mac-mini-m6
    name: Mac mini M6
    price_usd: 899
    price_confidence: CONFIRMED
    memory_gb_max: 32
    bandwidth_nominal_gb_s: 170
    bandwidth_effective_gb_s: null   # TODO: unverified
    date: 2026-08-25
    source: sources#apple-lineup
    notes: >-
      Cannot hold a 70B-class model at usable quantization and context. Fails on capacity
      before throughput is even a question. Memory ceiling is down from the M4 Pro era; see
      the supply-vs-demand analysis.

  - id: mac-mini-m5-pro
    name: Mac mini M5 Pro
    price_usd: 1699
    price_confidence: CONFIRMED
    price_as_configured_usd: 2700
    price_as_configured_confidence: VOLATILE
    price_as_configured_note: approximately, at the 64GB ceiling
    memory_gb_max: 64
    bandwidth_nominal_gb_s: 307
    bandwidth_effective_gb_s: null   # TODO: unverified
    date: 2026-08-25
    source: sources#apple-lineup
    throughput:
      - model: dense-70b
        quant: q4
        tok_s: 5.5
        tok_s_range: [5, 6]
        confidence: ESTIMATE
        note: handoff estimate from bandwidth arithmetic, not a bench run

  - id: gmktec-evo-x2
    name: GMKtec EVO-X2 (Strix Halo)
    price_usd: 1499
    price_confidence: VOLATILE
    memory_gb_max: 128
    bandwidth_nominal_gb_s: 256
    bandwidth_effective_gb_s: 215
    bandwidth_effective_confidence: MEASURED
    date: 2026-08-29
    source: sources#strix-halo
    throughput:
      - model: dense-70b
        quant: q4
        tok_s: 5
        confidence: ESTIMATE
        note: handoff estimate; fails the sustained-rate bar
      - model: gpt-oss-120b
        quant: mxfp4
        tok_s: 31
        confidence: MEASURED
        date: 2026-08-29

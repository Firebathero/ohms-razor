# CPU candidates for the deterministic-compute node (Model 5, Psi). SPECrate submissions
# never expire; street prices carry a 30-day window. Every candidate is ranked on a
# published single-chip int_base result where one exists, so the sigma scaling below is now
# a fallback rather than the main path.

# WHAT THIS LIST IS SUPPOSED TO COVER. Without this block the candidate set is whatever
# happened to come up in one conversation, and it never gets re-opened. The survey is the
# mechanism for re-examining priors: it says what belongs here, where to look for new
# entrants, and when the question was last actually asked.
survey:
  question: Which single-socket server CPUs could plausibly win on dollars per unit of sustained throughput
    for an always-on home or small-office compute node?
  inclusion_criteria:
  - 1P-validated, which the survey reads as "somebody published a single-chip SPECrate result",
    since that is evidence rather than a reading of a spec sheet
  - available new through normal channels, or credibly available used at a tracked price
  - a published SPECrate 2017 int_base result, or one derivable from a published ratio
  - a DDR5 platform on a standard socket the operator can actually buy a board for
  out_of_scope:
  - parts with no published single-chip result (a 2P-only number needs a scaling assumption)
  - GPUs and accelerators (different workload; the token side covers inference)
  - cloud instance types (priced separately under rental_offers)
  - DDR4 platforms, until the memory model carries a DDR4 price; see considered_and_excluded
  where_to_look:
  - spec.org, all published CPU2017 integer-rate results, filtered to one enabled chip
  - the quarterly result indexes at spec.org/cpu2017/results/res<YYYY>q<N>/, because the
    all-results page rint2017.html stopped being regenerated on 2025-02-11
  - AMD EPYC, Intel Xeon, and Ampere product pages for parts shipped since the last survey
  - Phoronix and ServeTheHome launch coverage for parts without SPEC submissions yet
  last_surveyed: 2026-08-31
  survey_interval_days: 90
  confidence: CONFIRMED
  method: >-
    Parsed every published CPU2017 integer-rate result from spec.org (13,179 results, newest
    2026-08-10) and kept the 2,876 with one enabled chip. Virtual-machine submissions were
    dropped: HPE published eight EPYC 9965 results at 153-163 points against a real 1,525,
    because the VM saw a slice of the socket while the disclosure still names 192 cores.
    Cross-matched what remained against the vendor spec tables for TDP, socket, memory
    channels and list price. Work rate is the median of a part's single-chip submissions,
    with the count and range recorded on every entry.
  note: >-
    First real survey. The candidate set went from 4 to 124, from one vendor to three, and
    every candidate now rests on a measured 1P result instead of a 2P result scaled by a
    sigma calibrated on one part. The four inherited candidates all survived: the EPYC 9965
    still wins on Psi. The result that matters more is that 114 of 118 contenders cannot
    reach its Psi even at a CPU price of zero, so the conclusion no longer depends on
    finishing the price research. What the survey did NOT settle is price basis: 113 of 119
    priced candidates carry only a vendor list price, which is an upper bound, so their true
    rank can only improve.
  considered_and_excluded:
  - what: AMD EPYC 9006 "Venice" and "Venice Dense" (Zen 6, up to 256 cores, SP7/SP8)
    why: >-
      Announced 2026-07-23 with list prices published, but no CPU2017 result of any kind has
      been submitted as of this survey, and it needs a new socket and board. Ranking it would
      mean inventing its work rate.
    revisit: the moment a single-chip int_base result appears; this is the likeliest displacer
  - what: DDR4 platforms (EPYC 7002/7003 on SP3, Ampere Altra and Altra Max)
    why: >-
      They are real single-socket parts with published 1P results and collapsed used prices,
      and memory is the dominant capex term, so a cheaper memory generation could plausibly
      win. Excluded only because the model has no DDR4 RDIMM price to solve with. This is a
      data gap, not a judgment that they lose.
    revisit: add ddr4_3200_rdimm_usd_per_gb to assumptions.yaml, then re-run this survey
  - what: dual-socket configurations
    why: the model prices one socket, one board, one PSU; a 2P build is a different machine
    revisit: only if the workload outgrows what one socket delivers
  - what: Intel Xeon 6 SKUs with no published single-chip result
    why: placing them would require scaling a 2P number by a sigma calibrated on an AMD part
    revisit: quarterly, as new submissions land
  - what: Intel Xeon 6978P
    why: >-
      A single-chip result exists (1,140 points) but no TDP or list price has been
      transcribed, so it is in the catalog and reported as unplaceable rather than dropped.
    revisit: transcribe from Intel ARK; it is the only unplaceable entry in the catalog
# The 1P/2P scaling factor. Since the 2026-08-31 survey every candidate carries its own
# published single-chip result, so this is a fallback for a future entrant that has only a
# 2P submission, plus the cross-check that showed the scaling was running 5 to 8 percent
# high. It stays tagged DERIVED everywhere it appears.
calibration:
  sigma_1p_scaling:
    value: 0.5256
    confidence: DERIVED
    date: 2026-08-29
    source: sources#specrate
    note: '1P/2P ratio calibrated on the EPYC 9745, the only candidate with both published: 1P 1,230 /
      2P 2,340 = 0.5256. Applied identically to every candidate, so it cancels out of the ranking even
      if it is off in absolute terms.'
# The surveyed field. Every entry carries the median of its published single-chip
# int_base submissions with the count and range in the note, the socket and memory
# channel count the build is sized from, and a price that is either street (what the part
# costs) or vendor list (an upper bound on what it costs). A candidate missing a figure
# stays in the file and is reported as unplaceable; nothing is dropped to tidy the list.

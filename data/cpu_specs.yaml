# CPU candidates for the deterministic-compute node (Model 5, Psi). SPECrate submissions
# never expire; street prices carry a 30-day window. The 1P scaling factor sigma and the
# cTDP derates phi are the two most important non-measured numbers in the repo and are
# tagged accordingly everywhere they appear.
calibration:
  sigma_1p_scaling:
    value: 0.5256
    confidence: DERIVED
    date: 2026-08-29
    source: sources#specrate
    note: >-
      1P/2P ratio calibrated on the EPYC 9745, the only candidate with both published:
      1P 1,230 / 2P 2,340 = 0.5256. Applied identically to every candidate, so it cancels
      out of the ranking even if it is off in absolute terms.

